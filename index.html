 const hemi=new THREE.HemisphereLight(0xddeef3,0x315467,2.1);scene.add(hemi);nightLights.push(hemi);
 const sun=new THREE.DirectionalLight(0xffedcf,3.2);sun.position.set(13,24,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);nightLights.push(sun);
 const fill=new THREE.DirectionalLight(0xb7d8ee,.7);fill.position.set(-15,12,-12);scene.add(fill);nightLights.push(fill);
 const water=new THREE.Mesh(new THREE.CircleGeometry(75,96),mat(0x244d68,.72));water.rotation.x=-Math.PI/2;water.position.y=-.36;water.receiveShadow=true;scene.add(water);
 // concentric subtle water rings
 for(let r=25;r<60;r+=8){const ring=new THREE.Mesh(new THREE.RingGeometry(r,r+.035,96),new THREE.MeshBasicMaterial({color:0x7ba1af,transparent:true,opacity:.12,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=-.34;scene.add(ring)}
 // Quiet navigation buoys add scale to the surrounding sea without competing with service labels.
 for(let i=0;i<16;i++){
   const a=i*Math.PI/8,rr=15.5,x=Math.cos(a)*rr,z=Math.sin(a)*rr;
   const buoy=new THREE.Mesh(new THREE.CylinderGeometry(.10,.14,.20,8),mat(i%2?0xe4d3ae:0x9eb7b4));
   buoy.position.set(x,-.20,z);scene.add(buoy);
 }
 const radius=9.7;
 const pos=DATA.islands.map((d,i)=>{const a=i*Math.PI/4;return [Math.sin(a)*radius,Math.cos(a)*radius]});
 DATA.islands.forEach((d,i)=>{d.pos={x:pos[i][0],z:pos[i][1]};makeIsland(d,d.pos)});
 // Eight radial wooden suspension bridges connect each equally spaced island to the central green island.
 DATA.islands.forEach(d=>{
  const len=Math.hypot(d.pos.x,d.pos.z),ux=d.pos.x/len,uz=d.pos.z/len;
  makeBridge({x:ux*4.10,z:uz*4.10},{x:d.pos.x-ux*1.48,z:d.pos.z-uz*1.48});
 });
 // Outer loop bridges connect neighboring service islands.
 for(let i=0;i<8;i++)makeRoad(DATA.islands[i].pos,DATA.islands[(i+1)%8].pos);
 centralOffice();
}
function openIsland(d){activeIsland=d;body.innerHTML=`<span class="tag">${d.icon} ${d.name}</span><h2>${d.name}</h2><div class="desc">${d.desc}</div><div style="margin-top:13px;font-weight:800;font-size:14px">民眾可能會這樣問：</div>${d.items.map((it,i)=>`<div class="service" data-index="${i}"><b>${it[2]}</b><span>${it[1]}</span></div>`).join('')}<div id="detail"></div><div class="source"><b>資料查核原則</b><br>① <a href="https://eservices.taichung.gov.tw/AdvSearch/index/160/Metasearch/0?ApplyType=0&amp;CodeLv0=0&amp;Lv1Dept=387020000A&amp;Lv2Dept=387023000A" target="_blank" rel="noopener">臺中市政府服務 e 櫃檯－太平戶政申辦服務</a><br>② <a href="https://www.ris.gov.tw/app/portal/" target="_blank" rel="noopener">內政部戶政司</a><br>③ <a href="https://www.htaiping.taichung.gov.tw/" target="_blank" rel="noopener">太平區戶政事務所</a><br><small>各項服務的受理地點、跨區限制、本人／委託資格及應備文件，須逐項依官方資料確認；尚未查核者不自行推定。</small></div>`;panel.classList.add('open');document.querySelectorAll('.service').forEach(el=>el.addEventListener('click',()=>showService(d,Number(el.dataset.index))));}
function showService(d,i){const it=d.items[i];const detail=document.querySelector('#detail');let extra='';if(it[0]==='natural'){extra=`<div class="serviceDetail"><b>已查核的官方資訊</b><p>自然人憑證及行動自然人憑證：年滿18歲、設有戶籍且未受監護宣告之本國國民，可本人至全國任一戶政事務所申請。實體 IC 卡工本費 250 元；行動自然人憑證工本費 30 元。申請及廢止須本人辦理；部分後續憑證作業可委託，須依官方委託規定備妥文件。</p><p><b>提醒：</b>此處為初版摘要，實際資格、費用及委託項目請以最新官方公告為準。</p><p><a href="https://www.htaiping.taichung.gov.tw/1520715/1520794/1520801/1578986/post" target="_blank" rel="noopener">太平戶政自然人憑證專區</a>　<a href="https://eservices.taichung.gov.tw/AdvSearch/CaseInfo/160/Notices/020798/387023000A?isHandling=true&amp;isLink=false" target="_blank" rel="noopener">服務 e 櫃檯申辦說明</a></p><span class="tag">任一戶政事務所｜申請須本人</span></div>`;}else if(it[0]==='passport'){extra=`<div class="serviceDetail"><b>服務範圍提醒</b><p>太平戶政服務項目列有「首次親辦人別確認或首辦護照一站式服務」。這不代表所有護照首次申請、換發或補發都能在戶政辦理；適用對象、受理方式及應備文件請依外交部與太平戶政最新公告確認。</p><p><a href="https://www.htaiping.taichung.gov.tw/1520715/1520736/1520743/1578224" target="_blank" rel="noopener">太平戶政服務項目</a></p><span class="tag">僅列戶所公告服務範圍</span></div>`;}else{extra=`<div class="serviceDetail"><b>${it[1]}</b><p>民眾說法：「${it[2]}」</p><p>此為服務導覽初版。受理地點（戶籍地／遷入地／任一戶所）、跨區辦理限制、申請人資格、是否可委託、應備文件及辦理期限，尚待逐項對照官方申辦說明後補齊。</p><span class="tag">辦理規定待官方逐項查核</span></div>`;}detail.innerHTML=extra;}
function flyToIsland(g){
 const p=g.position,from=camera.position.clone(),fromTarget=controls.target.clone();
 const currentAngle=Math.atan2(p.x,p.z)+orbitGroup.rotation.y;
 const delta=-currentAngle,toRot=orbitGroup.rotation.y+delta;
 const radius=Math.hypot(p.x,p.z),toTarget=new THREE.Vector3(0,0,radius);
 const to=new THREE.Vector3(4.2,7.8,radius+8.0);
 tween={t:0,from,to,fromTarget,toTarget,fromRot:orbitGroup.rotation.y,toRot,active:g,fromScale:g.scale.x,toScale:.96};
}
function resetView(){
 const from=camera.position.clone(),targetPos=new THREE.Vector3(12,14,22),fromTarget=controls.target.clone();
 tween={t:0,from,to:targetPos,fromTarget,toTarget:new THREE.Vector3(0,0,0),fromRot:orbitGroup.rotation.y,toRot:0,resetScales:true};
 panel.classList.remove('open');activeIsland=null;
}
function animateTween(){
 if(!tween)return;const e=1-Math.pow(1-tween.t,3);
 camera.position.lerpVectors(tween.from,tween.to,e);controls.target.lerpVectors(tween.fromTarget,tween.toTarget,e);
 if(tween.fromRot!==undefined)orbitGroup.rotation.y=THREE.MathUtils.lerp(tween.fromRot,tween.toRot,e);
 if(tween.active){tween.active.scale.setScalar(THREE.MathUtils.lerp(tween.fromScale,tween.toScale,e));}
 if(tween.resetScales){for(const g of islandGroups)g.scale.setScalar(THREE.MathUtils.lerp(g.scale.x,.66,e));}
 if(tween.t>=1){if(tween.resetScales)for(const g of islandGroups)g.scale.setScalar(.66);tween=null;}else tween.t+=.035;
}
function selectAt(x,y){mouse.x=x*2-1;mouse.y=-(y*2-1);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(clickable,true);if(!hits.length)return;let g=hits[0].object;while(g.parent&&!g.userData.type)g=g.parent;if(g.userData.type==='island'){const d=g.userData.data;openIsland(d);flyToIsland(g);toastMsg('已帶你前往「'+d.name+'」');}}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),1700)}
function search(q){q=q.trim().toLowerCase();if(!q){resetView();return}let found=null;for(const d of DATA.islands){const hit=(d.name+d.desc+d.items.flat().join('')).toLowerCase().includes(q);if(hit){found=d;break}}if(!found){toastMsg('暫時找不到相符項目，試試生活用語或正式業務名稱');return}const g=islandGroups.find(x=>x.userData.data.id===found.id);openIsland(found);flyToIsland(g);toastMsg('找到「'+found.name+'」');}
renderer.domElement.addEventListener('pointerup',e=>{if(e.button!==0)return;const r=renderer.domElement.getBoundingClientRect();selectAt((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)});
document.querySelector('#search').addEventListener('submit',e=>{e.preventDefault();search(document.querySelector('#q').value)});
document.querySelector('#close').onclick=()=>panel.classList.remove('open');document.querySelector('#home').onclick=resetView;
document.querySelector('#day').onclick=()=>{night=!night;document.querySelector('#day').textContent=night?'☀ 日景':'☾ 夜景';scene.background.set(night?0x061426:0x1d5068);scene.fog.color.set(night?0x0a1c30:0x1d5068);nightLights.forEach((l,i)=>l.intensity=l.userData.nightLamp?(night?2.0:0):(night?(i===0?.18:i===1?.28:.06):(i===0?2.1:i===1?3.2:.7)));nightObjects.forEach(o=>o.material.emissiveIntensity=night?.48:0);nightMaterials.forEach(m=>{m.opacity=night?1:0;if(m.emissiveIntensity!==undefined)m.emissiveIntensity=night?2.4:0});toastMsg(night?'靜謐夜景模式':'日景模式')};
scene.background=new THREE.Color(0x1d5068);setupWorld();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);animateTween();controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera)}loop();
</script>
